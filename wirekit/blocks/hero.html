<!--
  block: hero
  Use: top of landing or marketing page; primary headline + value prop + CTA
  Variants: hero-image (media right), hero-text-only (no media)
-->
<section data-region="HERO" aria-label="Hero">
  <div class="wk-two-col" style="align-items: center;">
    <div>
      <h1 data-placeholder>Main headline — product promise in 6 words</h1>
      <p data-placeholder>Supporting paragraph: 20 words that expand the promise and clarify who it's for.</p>
      <p style="margin-top: 1.5rem;">
        <a href="#" class="cta" data-placeholder>Primary CTA</a>
        &nbsp;
        <a href="#" style="font-family: var(--wk-font-secondary); font-size: 18px;" data-placeholder>Secondary link</a>
      </p>
    </div>
    <div class="img-placeholder" style="min-height: 280px;">
      <span>Hero image / illustration</span>
    </div>
  </div>
</section>
