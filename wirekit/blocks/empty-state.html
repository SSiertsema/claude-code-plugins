<!--
  block: empty-state
  Use: when a list / collection has zero items, or after filters clear results
  Variants: first-run (no data yet), filtered (no match), error (load failed — see error-state block for that)
-->
<section data-region="EMPTY STATE" aria-label="Nothing to show">
  <div style="text-align: center; padding: 2rem;">
    <div class="img-placeholder" style="min-height: 160px; max-width: 280px; margin: 0 auto 1.5rem;">
      <span>Illustration — empty state</span>
    </div>
    <h2 data-placeholder>What to show when there's nothing here</h2>
    <p data-placeholder>Explanation: 15 words about why it's empty and what the user can do next.</p>
    <p style="margin-top: 1.5rem;">
      <a href="#" class="cta" data-placeholder>Primary action — e.g., Add first item</a>
    </p>
    <p style="font-family: var(--wk-font-secondary); font-size: 16px;">
      <a href="#" data-placeholder>Secondary: learn more / import</a>
    </p>
  </div>
</section>
