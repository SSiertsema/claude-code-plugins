<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <!-- Wavy border filter — displaces element edges with fractal noise
         Used via CSS: filter: url('../svg/filters.svg#wavy');
         Browser support: Chrome, Firefox, Safari, Edge (modern). -->
    <filter id="wavy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>

    <!-- Gentler variant for text elements (if ever applied to text) -->
    <filter id="wavy-soft" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/>
    </filter>

    <!-- Stronger variant for emphasis / highlighted blocks -->
    <filter id="wavy-bold" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
  </defs>
</svg>
